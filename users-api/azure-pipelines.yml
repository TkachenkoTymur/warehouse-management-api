trigger:
  branches:
    include:
      - main
      - feature/*

stages:
- stage: StageID_PreBuild
  displayName: 'Pre-Build'
  jobs:
  - job: JobID_PreBuild
    displayName: 'Pre-Build Analysis'
    steps:
    - script: |
        echo "--- ПЕРЕВІРКА ФАЙЛІВ ---"
        ls -d $(Build.SourcesDirectory)/*/
        
        LOGPATH=$(find $(Build.SourcesDirectory) -name "logging.sh" | head -n 1)
        
        if [ -z "$LOGPATH" ]; then
          echo "Файл logging.sh не знайдено! Перевір назву репо ci-templates"
          exit 1
        fi
        
        source "$LOGPATH"
        
        info_msg "--- PREDEFINED VARIABLES ---"
        info_msg "Agent.TempDirectory: $(Agent.TempDirectory)"
        info_msg "Build.Repository.Name: $(Build.Repository.Name)"
        info_msg "Build.SourceBranch: $(Build.SourceBranch)"
      displayName: 'Debug and Print Variables'

- stage: StageID_BuildAndTestProject
  displayName: 'Project: Build and Test'
  dependsOn: StageID_PreBuild
  jobs:
  - job: JobID_BuildAndTest
    displayName: 'Build and Test'
    steps:
    - script: echo "Hello, from Build And Test Job"
      displayName: 'Script'

- stage: StageID_PostBuild
  displayName: 'Post-Build'
  dependsOn: StageID_BuildAndTestProject
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: JobID_PostBuild
    displayName: 'Post-Build'
    steps:
    - script: echo "Hello, from Post-Build Job"
      displayName: 'Script'