trigger:
  branches:
    include:
      - main
      - feature/*

resources:
  repositories:
    - repository: ci-templates
      type: github
      name: TkachenkoTymur/ci-templates
      endpoint: TkachenkoTymur      

variables:
- group: 'USERS_API_VARIABLE_GROUP'

stages:
- stage: StageID_PreBuild
  displayName: 'Pre-Build'
  jobs:
  - job: JobID_PreBuild
    displayName: 'Pre-Build Analysis'
    steps:
    - checkout: self
    - checkout: ci-templates
    - script: |
        source $(Build.SourcesDirectory)/ci-templates/common-scripts/dockerhub.sh
        source $(Build.SourcesDirectory)/ci-templates/common-scripts/logging.sh
        CURRENT_VER="1.0.5" 
        NEW_VER=$(get_docker_image_latest_version $CURRENT_VER)
        echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$NEW_VER"
      name: CalculateAppVersion

- stage: StageID_BuildAndTestProject
  displayName: 'Project: Build and Test'
  dependsOn: StageID_PreBuild
  jobs:
  - job: JobID_BuildAndTest
    variables:
      VERSION: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]
    steps:
    - script: echo "Building version $(VERSION)"

- stage: StageID_BuildAndPushDockerImage
  displayName: 'Docker: Build and Push'
  dependsOn: StageID_BuildAndTestProject
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  jobs:
  - job: JobID_BuildAndPushDockerImage
    displayName: 'Build and Push'
    variables:
      APP_VERSION: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]
    steps:
    - checkout: self
    
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        containerRegistry: 'DockerHubConnection'
        repository: $(DOCKER_REPO)
        command: 'build'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(APP_VERSION)
          latest

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/DockerImage
        # Використовуємо повний шлях, який Docker точно зрозуміє
        docker save $(DOCKER_ID)/$(DOCKER_REPO):$(APP_VERSION) -o $(Build.ArtifactStagingDirectory)/DockerImage/image.tar
      displayName: 'Save Docker image to tar'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Docker image artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/DockerImage/image.tar'
        artifact: 'DockerImage_$(APP_VERSION)'

    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        containerRegistry: 'DockerHubConnection'
        repository: $(DOCKER_REPO)
        command: 'push'
        tags: |
          $(APP_VERSION)
          latest

- stage: StageID_HelmChart
  displayName: 'Helm Chart: Pack and...'
  dependsOn: StageID_BuildAndPushDockerImage
  jobs:
  - job: JobID_HelmChart
    steps:
    - script: echo "Helm Stage placeholder"

- stage: StageID_PostBuild
  displayName: 'Post-Build'
  dependsOn: StageID_HelmChart
  condition: always()
  jobs:
  - job: JobID_PostBuild
    steps:
    - script: echo "Final stage reached"