trigger:
  branches:
    include:
      - main
      - feature/*

resources:
  repositories:
    - repository: ci-templates
      type: github
      name: TkachenkoTymur/ci-templates
      endpoint: TkachenkoTymur      

variables:
- group: 'USERS_API_VARIABLE_GROUP'

stages:
- stage: StageID_PreBuild
  displayName: 'Pre-Build'
  jobs:
  - job: JobID_PreBuild
    displayName: 'Pre-Build Analysis'
    steps:
    - checkout: self
    - checkout: ci-templates

    - script: |
        source $(Build.SourcesDirectory)/ci-templates/common-scripts/dockerhub.sh
        source $(Build.SourcesDirectory)/ci-templates/common-scripts/logging.sh
        
        # Імітуємо поточну версію з Docker Hub
        CURRENT_VER="1.0.5" 
        
        # Викликаємо функцію інкременту з твого скрипта
        NEW_VER=$(get_docker_image_latest_version $CURRENT_VER)
        
        # Передаємо версію далі по пайплайну
        echo "##vso[task.setvariable variable=APP_VERSION;isOutput=true]$NEW_VER"
        
        info_msg "Current version found: $CURRENT_VER"
        info_msg "Calculated new version: $NEW_VER"
      name: CalculateAppVersion
      displayName: 'Calculate Application Version'

    - script: |
        source $(Build.SourcesDirectory)/ci-templates/common-scripts/logging.sh
        
        info_msg "--- PREDEFINED VARIABLES ---"
        info_msg "Agent.TempDirectory: $(Agent.TempDirectory)"
        info_msg "Build.ArtifactStagingDirectory: $(Build.ArtifactStagingDirectory)"
        info_msg "Build.Repository.Name: $(Build.Repository.Name)"
        info_msg "Build.SourceBranch: $(Build.SourceBranch)"
        info_msg "Build.SourcesDirectory: $(Build.SourcesDirectory)"
      displayName: 'Predefined variables with color'

- stage: StageID_BuildAndTestProject
  displayName: 'Project: Build and Test'
  dependsOn: StageID_PreBuild
  jobs:
  - job: JobID_BuildAndTest
    displayName: 'Build and Test'
    variables:
      VERSION: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]
    steps:
    - script: |
        echo "Hello, from Build And Test Job"
        echo "Building application version: $(VERSION)"
      displayName: 'Build with version'

- stage: StageID_PostBuild
  displayName: 'Post-Build'
  dependsOn: StageID_BuildAndTestProject
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: JobID_PostBuild
    displayName: 'Post-Build'
    steps:
    - script: echo "Hello, from Post-Build Job"
      displayName: 'Script'