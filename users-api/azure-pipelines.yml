trigger:
  branches:
    include:
      - main
      - feature/*

resources:
  repositories:
    - repository: ci-templates
      type: github
      name: TkachenkoTymur/ci-templates
      endpoint: TkachenkoTymur      

variables:
- group: 'USERS_API_VARIABLE_GROUP'

stages:
- template: templates/stages/pre-build/v1.yaml@ci-templates
  parameters:
    ciTemplatesRepo: 'ci-templates'

- template: templates/stages/dotnet/v1.yaml@ci-templates
  parameters:
    appVersion: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]

- template: templates/stages/docker/v1.yaml@ci-templates
  parameters:
    appVersion: $[ stageDependencies.StageID_PreBuild.JobID_PreBuild.outputs['CalculateAppVersion.APP_VERSION'] ]
    dockerHubID: 'tymurtkachenkoks22'
    dockerRepo: 'users-api'

- stage: StageID_HelmChart
  displayName: 'Helm Chart'
  dependsOn: StageID_BuildAndPushDockerImage
  jobs:
  - job: JobID_HelmChart
    steps:
    - script: echo "Helm Stage placeholder"